<section class="py-16 bg-white">
  <div class="max-w-3xl mx-auto px-4 sm:px-8">
    <!-- Header -->
    <div class="text-center mb-10">
      <div class="inline-flex items-baseline gap-2 mb-3">
        <span class="mb-6 text-center text-xl font-bold md:mb-1 text-gray-900">Aankomende evenementen</span>
      </div>
      <p class="mb-6 text-center text-sm font-bold md:mb-1 text-gray-400">Clubevenementen 2026–2027</p>
    </div>

    <!-- Events -->
    <div class="border-t border-gray-100">
      @for (event of events(); track $index) {
        <a
          [href]="event.slug"
          class="flex items-center gap-4 sm:gap-6 py-4 px-3 sm:px-4 border-b border-gray-100 hover:bg-red-50 transition-colors group no-underline"
        >
          <!-- Date -->
          <div class="w-28 sm:w-36 shrink-0 text-red-700 font-bold text-xs sm:text-sm leading-snug">
            {{ event.date }}
          </div>

          <!-- Separator -->
          <div class="w-px h-8 bg-red-700 shrink-0"></div>

          <!-- Content -->
          <div class="flex-1 min-w-0">
            <div class="font-bold text-gray-900 text-xs sm:text-sm uppercase tracking-wide group-hover:text-red-700 transition-colors leading-snug">
              {{ event.title }}
            </div>
            <div class="text-gray-400 text-xs mt-0.5 truncate">{{ event.excerpt }}</div>
          </div>

          <!-- Arrow -->
          <svg
            class="w-4 h-4 text-red-600 shrink-0 opacity-0 group-hover:opacity-100 transition-opacity"
            fill="none" stroke="currentColor" viewBox="0 0 24 24"
          >
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/>
          </svg>
        </a>
      }
    </div>
  </div>
</section>
